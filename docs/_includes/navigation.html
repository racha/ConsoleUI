<nav id="site-nav" class="sidebar" aria-label="Documentation navigation">
  {% for group in site.data.navigation %}
    <p class="nav-group">{{ group.title }}</p>
    <ul>
      {% for item in group.items %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="is-current" aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endfor %}
</nav>
